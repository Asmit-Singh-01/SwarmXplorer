name: SwarmXplorer Autonomous Engineer Agent

on:
  schedule:
    # Continuous daily commits ke liye (Har 2 ghante me automatic chalega)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Phone se manual trigger karne ke liye

jobs:
  agent-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SwarmXplorer Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run AI Swarm Architect Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os, glob, json
          from google import genai

          # 1. Repo ki existing python files ka context read karo
          repo_files = glob.glob('**/*.py', recursive=True) + glob.glob('**/*.md', recursive=True)
          context = ''
          for fname in repo_files[:10]:
              try:
                  with open(fname, 'r') as f:
                      context += f'--- File: {fname} ---\n' + f.read()[:800] + '\n\n'
              except Exception:
                  pass

          # 2. Gemini AI ko SwarmXplorer ke liye feature code likhne ko bolo
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          prompt = f'''
          You are a Senior Swarm Intelligence Engineer for SwarmXplorer framework.
          Current repo context:
          {context}

          Task: Generate a production-grade Python module, algorithm (in algos/), simulation component (in sim/), or unit test (in tests/) to improve this framework.
          Output strictly valid JSON only:
          {{
            \"filepath\": \"relative path like algos/dynamic_obstacle_avoidance.py\",
            \"code\": \"full runnable python code with comments\",
            \"commit_message\": \"feat(algos): added dynamic obstacle avoidance module\"
          }}
          '''

          response = client.models.generate_content(
              model='gemini-3.8-flash',
              contents=prompt
          )

          text = response.text.strip()
          if text.startswith('```json'):
              text = text[7:-3].strip()
          elif text.startswith('```'):
              text = text[3:-3].strip()

          data = json.loads(text)

          # Directory check aur file creation
          os.makedirs(os.path.dirname(data['filepath']), exist_ok=True)
          with open(data['filepath'], 'w') as f:
              f.write(data['code'])

          with open('commit_msg.txt', 'w') as f:
              f.write(data['commit_message'])
          "

      - name: Commit and Push Agent Contributions
        run: |
          git config --global user.name 'Swarm-Architect-Bot'
          git config --global user.email 'swarm-agent@github.com'
          git add .
          
          MSG=$(cat commit_msg.txt 2>/dev/null || echo "feat(swarm): continuous autonomous improvement")
          
          git commit -m "$MSG [skip ci]" || exit 0
          git push
          
