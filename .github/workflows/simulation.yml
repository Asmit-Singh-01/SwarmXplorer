name: SwarmXplorer Simulation Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-sim:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib

    - name: Run Swarm Simulation
      run: |
        python main.py

    - name: Commit Generated Map to Repo
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add swarm_exploration_map.png
        git commit -m "Auto-update swarm exploration map [skip ci]" || exit 0
        git push
        
