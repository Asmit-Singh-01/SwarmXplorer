name: Generate Pitch Dashboard Visual

on:
  workflow_dispatch:

jobs:
  build-visual:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib numpy

    - name: Step 1 - Generate simulation logs
      run: python core/poc_simulator.py

    - name: Step 2 - Render dashboard visual image
      run: python sim/dashboard_renderer.py

    - name: Commit and push generated image to repo
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add logs/pitch_dashboard_visual.png
        git commit -m "chore: auto-generate pitch dashboard visual [skip ci]" || echo "No changes to commit"
        git push
