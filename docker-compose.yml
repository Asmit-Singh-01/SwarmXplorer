version: '3.8'

services:
  swarm_coordinator:
    build: .
    container_name: swarm_coordinator_node
    environment:
      - AGENT_ID=0
      - NODE_ROLE=coordinator
    networks:
      - swarm_mesh_net

  swarm_agent_1:
    build: .
    container_name: swarm_agent_node_1
    environment:
      - AGENT_ID=1
      - NODE_ROLE=worker
    networks:
      - swarm_mesh_net

  swarm_agent_2:
    build: .
    container_name: swarm_agent_node_2
    environment:
      - AGENT_ID=2
      - NODE_ROLE=worker
    networks:
      - swarm_mesh_net

networks:
  swarm_mesh_net:
    driver: bridge

